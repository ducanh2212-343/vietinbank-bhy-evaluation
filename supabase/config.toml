[functions]
  [functions.auth-email-hook]
    verify_jwt = false
  [functions.process-email-queue]
    verify_jwt = true
  [functions.send-transactional-email]
    verify_jwt = true
  [functions.preview-transactional-email]
    verify_jwt = false
  [functions.handle-email-unsubscribe]
    verify_jwt = false
  [functions.handle-email-suppression]
    verify_jwt = false
  [functions.ai-advisor]
    verify_jwt = true
  [functions.create-staff-user]
    verify_jwt = true
  [functions.bulk-create-staff-users]
    verify_jwt = true
  [functions.reset-staff-password]
    verify_jwt = true
  [functions.update-staff-email]
    verify_jwt = true
  [functions.delete-staff]
    verify_jwt = true
  [functions.send-reminders]
    # Cron gửi service_role JWT hợp lệ; user admin gửi JWT của họ → verify_jwt = true
    # (cổng nền tảng chặn JWT sai trước khi vào code; code vẫn kiểm role/quyền).
    verify_jwt = true
  [functions.send-hr-notification]
    verify_jwt = true
  [functions.send-feature-tip-push]
    # Cron gửi service_role JWT; admin chạy tay bằng JWT của họ → verify_jwt = true
    verify_jwt = true

  # ---- Chín hàm dưới đây trước 24/08/2026 KHÔNG được khai ở đây ------------
  # Vì sao phải khai đủ dù Supabase mặc định verify_jwt = true: thiết lập nào
  # không nằm trong config.toml thì chỉ tồn tại ở bảng điều khiển trên web —
  # một cú bấm nhầm (hoặc một người có quyền dự án) tắt verify_jwt là hàm mở
  # toang ra Internet mà repo không hề đổi một dòng nào, review PR cũng không
  # thấy. Khai đủ mọi hàm để mỗi lần deploy đều ép lại đúng trạng thái mong muốn
  # và mọi thay đổi quyền phải đi qua một diff có người duyệt.
  #
  # AI THÊM HÀM MỚI THÌ THÊM MỘT KHỐI Ở ĐÂY NGAY TRONG CÙNG PR — kể cả khi để
  # mặc định. `doi-mat-khau` ra đời trong chính nhánh này nên được khai ở cuối tệp.
  # Lưu ý khi gộp nhánh: khai trùng một [functions.x] là hỏng cả tệp TOML, nên nếu
  # nhánh khác cũng khai hàm đó thì giữ lại đúng MỘT khối.
  #
  # Tất cả đều đang được gọi bằng JWT hợp lệ nên khai = true KHÔNG đổi hành vi:
  # cron/trigger gọi qua pg_net kèm service_role key lấy từ Vault, còn các hàm
  # chạy tay thì gọi từ giao diện bằng JWT của cán bộ (code vẫn tự kiểm vai trò).
  [functions.approve-registration]
    verify_jwt = true
  [functions.create-guest-user]
    verify_jwt = true
  [functions.ct2-nhip-bao-cao]
    verify_jwt = true
  [functions.nhac-lich-nghi]
    verify_jwt = true
  [functions.notify-ct2]
    verify_jwt = true
  [functions.notify-idea-council]
    verify_jwt = true
  [functions.notify-kanban-update]
    verify_jwt = true
  [functions.quiz-reminders]
    verify_jwt = true
  [functions.weekly-kanban-digest]
    verify_jwt = true

  # Đổi mật khẩu của chính mình + hạ cờ must_change_password ở app_metadata.
  # verify_jwt = true là BẮT BUỘC: hàm dựa hẳn vào JWT để biết đang đổi mật khẩu
  # cho ai, tắt đi là ai cũng đổi được mật khẩu của người khác.
  [functions.doi-mat-khau]
    verify_jwt = true

  # Trả tệp .vcf cho KHÁCH quét danh thiếp số — công khai theo thiết kế: dữ liệu
  # đã được nc_resolve_card() lọc theo ma trận quyền hiển thị và anon vốn gọi
  # được hàm đó. Bật verify_jwt là khách (không có phiên) tải không được.
  [functions.danh-thiep-vcard]
    verify_jwt = false
