<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      TRANG DANH THIẾP SỐ CÔNG KHAI — entry riêng, không phải cổng nội bộ.
      Khách hàng quét QR/NFC rơi vào đây (Cloudflare: public/_redirects ánh xạ
      /card/* → tệp này; Vercel: vercel.json). Mục tiêu: tổng tải < 300 KB,
      khách lưu được liên hệ trong ≤ 12 giây. Không cookie, không theo dõi.
    -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#12202E" />
    <meta name="color-scheme" content="light" />
    <meta name="format-detection" content="telephone=yes" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Danh thiếp — VietinBank Chi nhánh Bắc Hưng Yên</title>
    <meta name="description" content="Danh thiếp số của cán bộ VietinBank Chi nhánh Bắc Hưng Yên." />

    <link rel="preconnect" href="https://whlysprzsguehxmrjwha.supabase.co" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Be Vietnam Pro theo đặc tả — chỉ 400/600/700, Google Fonts tự cắt subset
      latin + vietnamese. Nạp không chặn hiển thị (preload → stylesheet) như
      index.html. Font CJK nạp SAU, theo đúng ngôn ngữ đang hiển thị và chỉ đúng
      những ký tự có trên thẻ (tham số text=) — mỗi bộ CJK đầy đủ nặng 4–8 MB.
    -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap" />
    </noscript>

    <!-- Nền và khung chờ vẽ ngay từ HTML: không chớp trắng, không đợi JS -->
    <style>
      html { background: #12202E; }
      body { margin: 0; min-height: 100dvh; font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif; color: #12202E; -webkit-font-smoothing: antialiased; }
      #boot { min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; }
      #boot > div { width: 100%; max-width: 420px; background: #fff; border-radius: 20px; padding: 28px 22px; box-shadow: 0 24px 60px -20px rgba(0,0,0,.5); text-align: center; }
      #boot i { display: block; width: 120px; height: 3px; margin: 0 auto 14px; border-radius: 99px; background: rgba(18,32,46,.12); overflow: hidden; }
      #boot i::after { content: ''; display: block; width: 40%; height: 100%; background: linear-gradient(90deg, #A8763E, #d2a56b); animation: nc-boot 1.1s cubic-bezier(.4,0,.2,1) infinite; }
      #boot span { font-size: 13px; color: #5b6b7a; letter-spacing: .02em; }
      @keyframes nc-boot { from { transform: translateX(-100%); } to { transform: translateX(330%); } }
      @media (prefers-reduced-motion: reduce) { #boot i::after { animation: none; width: 100%; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot" role="status" aria-live="polite">
        <div><i></i><span>Đang mở danh thiếp · Loading…</span></div>
      </div>
    </div>
    <script type="module" src="/src/danh-thiep-cong-khai/main.tsx"></script>
  </body>
</html>
